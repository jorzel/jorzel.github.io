<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <link rel="shortcut icon" type="image/png" href="{{ site.baseurl }}/images/favicon-16x16.png">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="container">
      <header class="masthead">
        <p class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></p>
        <nav>
          <a href="{{ site.baseurl }}/">Blog</a>
          <a href="{{ site.baseurl }}/about">About</a>
        </nav>
      </header>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="container">
      <footer class="footer">
        <ul class="footer-links">
          {% for link in site.data.elsewhere %}<li><a href="{{ link.url }}">{{ link.name }}</a></li>{% endfor %}
          <li><a href="mailto:{{ site.email }}">Email</a></li>
          <li><a href="{{ site.baseurl }}/feed.xml">RSS</a></li>
        </ul>
      </footer>
    </div>

    {% include analytics.html %}
  </body>
</html>
