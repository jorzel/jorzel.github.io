---
layout: default
comments: true
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {% if page.tags.size > 0 %}
      <span class="tags">
        {% for tag in page.tags %}<a href="/tag/{{ tag }}">{{ tag }}</a>{% endfor %}
      </span>
      {% endif %}
    </p>
  </header>

  <div class="entry">
    {{ content }}
  </div>

  {% include disqus.html %}
</article>
